<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">Rendez-vous</a>

    <nav class="nav" aria-label="Navigation principale">
      @for (item of navigationItems; track item.route) {
        @if (canShowNavigationItem(item)) {
          <a [routerLink]="item.route" routerLinkActive="active">{{ item.label }}</a>
        }
      }
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <span>Frontend Rendez-vous</span>
        @if (auth.user(); as currentUser) {
          <p>{{ auth.displayName() }} · {{ currentUser.roles.join(', ') }}</p>
        }
      </div>

      <button type="button" (click)="auth.logout()">Déconnexion</button>
    </header>

    <section class="page">
      <router-outlet />
    </section>
  </main>
</div>
