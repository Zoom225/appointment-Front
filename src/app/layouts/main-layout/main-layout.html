<div class="shell">
  <aside class="sidebar" [class.open]="isMenuOpen()">
    <div class="sidebar-header">
      <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
        <span class="brand-mark">GR</span>
        <span>Gestion de rendez-vous</span>
      </a>
      <button type="button" class="menu-close" (click)="closeMenu()">Fermer</button>
    </div>

    <nav class="nav" aria-label="Navigation principale">
      @for (item of navigationItems; track item.route) {
        @if (canShowNavigationItem(item)) {
          <a [routerLink]="item.route" routerLinkActive="active" (click)="closeMenu()">
            <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <button type="button" class="menu-button" (click)="toggleMenu()">Menu</button>

      <div class="identity">
        <span>{{ auth.displayName() }}</span>
        @if (auth.user(); as currentUser) {
          <p>{{ currentUser.email }} · {{ roleLabel() }}</p>
        }
      </div>

      <button type="button" class="logout-button" (click)="auth.logout()">Déconnexion</button>
    </header>

    <section class="page">
      <router-outlet />
    </section>
  </main>
</div>
