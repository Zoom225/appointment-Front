<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">Rendez-vous</a>

    <nav class="nav" aria-label="Navigation principale">
      <a routerLink="/dashboard" routerLinkActive="active">Tableau de bord</a>
      <a routerLink="/appointments" routerLinkActive="active">Rendez-vous</a>
      @if (canManageUsers()) {
        <a routerLink="/users" routerLinkActive="active">Utilisateurs</a>
      }
      <a routerLink="/profile" routerLinkActive="active">Profil</a>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <div>
        <span>Frontend Rendez-vous</span>
        @if (auth.user(); as currentUser) {
          <p>{{ auth.displayName() }} · {{ currentUser.roles.join(', ') }}</p>
        }
      </div>

      <button type="button" (click)="auth.logout()">Déconnexion</button>
    </header>

    <section class="page">
      <router-outlet />
    </section>
  </main>
</div>
