<app-page-header eyebrow="Administration" title="Utilisateurs" />

@if (isLoading()) {
  <app-state-card title="Chargement" description="Récupération des utilisateurs..." />
} @else if (errorMessage()) {
  <app-state-card title="Erreur" [description]="errorMessage()!" />
} @else if (users().length === 0) {
  <app-state-card title="Aucun utilisateur" description="Le backend n’a renvoyé aucun compte." />
} @else {
  <section class="user-list">
    @for (user of users(); track user.id) {
      <article class="user-card">
        <div>
          <h2>{{ user.firstName }} {{ user.lastName }}</h2>
          <p>{{ user.email }}</p>
        </div>
        <span>{{ user.roles.join(', ') }}</span>
      </article>
    }
  </section>
}
